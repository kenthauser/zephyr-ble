# Connected ISO on the PAST sender only. Its control PDU maximums are then
# selected from cis_req (36 octets), which holds LL_PERIODIC_SYNC_IND (35)
# whatever the selection does with it, so the sender sends the PDU whole. The
# receiver keeps prj_past_dlemin.conf, so past_dlemin_rx.sh tests the
# receive maximum on its own.
CONFIG_BT_ISO_CENTRAL=y
